name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
      - name: Build the gem, install it, smoke test it
        run: |
          gem build sendclipper.gemspec
          gem install --local ./sendclipper-*.gem
          ruby -w -e 'require "sendclipper"; abort "source tree" unless $LOADED_FEATURES.grep(%r{sendclipper\.rb\z}).first.include?("/gems/"); puts SendClipper::VERSION'
